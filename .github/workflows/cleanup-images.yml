name: Clean up GHCR images

# Every publish leaves behind the previous manifest list and its per-arch
# images, none of which any tag points at any more.  This deletes those, with
# a week of backlog kept so a bad build can still be rolled back by digest.
#
# Not actions/delete-package-versions: that deletes every untagged version,
# and our per-arch images are untagged versions referenced only by the tagged
# manifest list.  This action walks the manifests and keeps what is referenced.

on:
  schedule:
    - cron: "30 6 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report what would be deleted
        type: boolean
        default: true
      delete-tags:
        description: "Regex of tags to delete outright; empty for none.  Stale point-release tags: ^5[.][0-9]+[.][0-9]+$|^5[.][0-9]+[.][0-9]+-[a-z]+$  (the action rejects quantified groups as ReDoS-prone, so spell alternatives out)"
        type: string
        default: ""
      older-than:
        description: Only touch images older than this (the schedule uses 7 days)
        type: string
        default: 7 days

# Don't prune while a publish is mid-flight.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: perl-ci
          delete-untagged: true
          delete-orphaned-images: true
          older-than: ${{ inputs.older-than || '7 days' }}
          validate: true
          use-regex: true
          delete-tags: ${{ inputs.delete-tags }}
          # On a routine run, never touch an image carrying a live alias tag.
          # Exclusion is per image, not per tag, so it has to come off when a
          # tag is being deleted deliberately: the stale point-release tags
          # sit on the same images as the live aliases.  The action untags
          # rather than deletes an image that still has other tags.
          exclude-tags: ${{ inputs.delete-tags == '' && '^(devel|5[.][0-9]+)$|^(devel|5[.][0-9]+)-[a-z]+$' || '' }}
          dry-run: ${{ inputs.dry-run || false }}
